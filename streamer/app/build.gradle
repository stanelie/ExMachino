plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Shared version, read from the repo root. versionCode must increase monotonically for
// Android, so it is derived from the semantic version: major*10000 + minor*100 + patch.
def exmVersion = new File(rootProject.projectDir, "../VERSION").text.trim()
def exmVersionCode = {
    def parts = exmVersion.tokenize('.')
    parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()
}()

android {
    namespace 'com.exmachina.epoccamstreamer'
    compileSdk 33

    defaultConfig {
        applicationId "com.exmachina.epoccamstreamer"
        minSdk 23
        targetSdk 33
        // Single source of truth for both apps: ../VERSION at the repo root. The streamer
        // and the viewer must be released as a matched pair — the wire protocol between them
        // changes with almost every feature — so neither carries a version of its own.
        versionCode exmVersionCode
        versionName exmVersion
    }

    buildTypes {
        debug { debuggable true }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "epoccam-streamer.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Pure-Java mDNS responder. Replaces android.net.nsd.NsdManager, whose daemon was
    // measured registering this service in 2s, 73s and 109s on the same phone with
    // identical code — and which cannot be safely forced (rapid re-registration wedges it
    // outright). JmDNS keeps registration in-process where we control it.
    implementation 'org.jmdns:jmdns:3.5.9'
}
